name: Build RunPod Handlers

on:
  push:
    paths:
      - 'handler_biglust.py'
      - 'handler_crystalclear.py'
      - 'Dockerfile.biglust'
      - 'Dockerfile.crystalclear'

jobs:
  build-biglust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.biglust
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nudely-biglust:latest
          build-args: |
            CIVITAI_TOKEN=${{ secrets.CIVITAI_TOKEN }}

  build-crystalclear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.crystalclear
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nudely-crystalclear:latest
          build-args: |
            CIVITAI_TOKEN=${{ secrets.CIVITAI_TOKEN }}
