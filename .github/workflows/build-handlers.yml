name: Build RunPod Handlers

on:
  push:
    paths:
      - 'handlers/**'

jobs:
  build-biglust:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h

      - uses: actions/checkout@v3

      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v4
        with:
          context: ./handlers
          file: ./handlers/Dockerfile.biglust
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nudely-biglust:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nudely-biglust:v${{ github.run_number }}
          build-args: |
            CIVITAI_TOKEN=${{ secrets.CIVITAI_TOKEN }}

  build-crystalclear:
